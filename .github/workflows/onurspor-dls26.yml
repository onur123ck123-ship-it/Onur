name: Fix Onurspor DLS26 UV
on:
  push:
    paths: ['.github/workflows/onurspor-dls26.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render mapped kit
        run: |
          pip -q install pillow requests
          cat > /tmp/render.py <<'PY'
          from PIL import Image, ImageDraw, ImageFont,ImageOps,ImageEnhance
          import requests,io
          S=512
          im=Image.new('RGBA',(S,S),(0,0,0,0)); d=ImageDraw.Draw(im)
          navy=(8,28,82,255); blue=(10,110,221,255); cyan=(23,188,247,255); white=(255,255,255,255)
          # Established classic/modern DLS atlas: torso back LEFT, torso front RIGHT, shared central collar.
          # Top: collars, shirt motifs and short sleeves.
          d.polygon([(242,0),(327,0),(354,14),(370,7),(377,110),(241,110)],fill=navy)
          d.polygon([(379,3),(488,3),(502,13),(500,107),(380,109)],fill=navy)
          # central joined front/back shirts, x=135..352 back, x=375..500 front?  mapped front kept right.
          d.polygon([(137,126),(343,119),(362,132),(369,125),(375,116),(493,121),(509,261),(375,262),(353,239),(334,265),(137,267)],fill=navy)
          # Front torso area RIGHT
          d.polygon([(375,123),(492,125),(506,257),(374,256)],fill=(6,38,105,255))
          d.polygon([(478,125),(489,125),(505,252),(493,254)],fill=blue)
          d.polygon([(393,213),(404,212),(454,258),(440,258)],fill=blue)
          # Back LEFT plain to preserve name and number.
          d.polygon([(150,134),(332,128),(332,251),(147,256)],fill=navy)
          d.line([(151,247),(332,247)],fill=(12,88,166,255),width=4)
          # Sleeves on left in central area
          d.polygon([(5,128),(96,125),(113,145),(113,232),(94,256),(5,259)],fill=navy)
          d.polygon([(6,263),(99,262),(111,279),(107,338),(4,340)],fill=navy)
          for y in (212,221,309):
              d.line([(10,y),(102,y)],fill=cyan,width=6)
          # long sleeves below shirt body
          d.polygon([(141,275),(287,275),(298,300),(290,371),(143,371)],fill=navy)
          d.polygon([(310,275),(445,274),(459,290),(456,372),(308,374)],fill=navy)
          for x1,x2 in ((145,284),(315,452)):
              d.line([(x1,342),(x2,342)],fill=cyan,width=8)
              d.line([(x1,358),(x2,358)],fill=blue,width=6)
          # sock and shorts lower region
          d.polygon([(5,390),(224,390),(240,424),(231,493),(3,494)],fill=navy)
          d.polygon([(260,391),(480,390),(508,421),(506,492),(268,494)],fill=navy)
          d.polygon([(25,394),(35,394),(79,490),(65,490)],fill=blue)
          d.polygon([(472,394),(482,394),(502,480),(494,481)],fill=blue)
          d.line([(5,485),(228,485)],fill=cyan,width=7)
          d.line([(271,485),(502,485)],fill=cyan,width=7)
          # collar rings + number swatches
          d.ellipse((11,5,50,44),fill=cyan);d.ellipse((20,13,41,36),fill=(0,0,0,0))
          d.ellipse((10,49,50,89),fill=cyan);d.ellipse((20,58,40,79),fill=(0,0,0,0))
          d.rectangle((471,334,491,353),fill=white)
          d.rectangle((471,358,491,378),fill=white)
          font='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          def write_rotated(lines,box,angle=90):
              lay=Image.new('RGBA',(240,140)); draw=ImageDraw.Draw(lay)
              for i,(s,sz) in enumerate(lines):
                  f=ImageFont.truetype(font,sz); draw.text((6,9+i*43),s,font=f,fill=white)
              lay=lay.rotate(angle,expand=True)
              lay.thumbnail((box[2],box[3]),Image.Resampling.LANCZOS)
              im.alpha_composite(lay,(box[0],box[1]))
          # The right-hand front shirt graphic is rotated to face correct way in DLS UV.
          write_rotated([('MERCAN KAFE',19),('SIFNE',24)],(411,169,67,84),90)
          # compact front crest, safely away from seams
          crest=Image.new('RGBA',(40,40));cd=ImageDraw.Draw(crest)
          cd.rounded_rectangle((3,2,37,38),radius=9,fill=(4,14,49),outline=cyan,width=3)
          cd.polygon([(9,25),(21,8),(30,25),(21,21)],fill=white)
          crest=crest.rotate(90,expand=True).resize((25,25))
          im.alpha_composite(crest,(385,145))
          # optional portrait kept very small and only on front, preserving sponsor
          try:
              r=requests.get('https://at.adobe.com/GHVxHP9370Yhf7BS',timeout=25);r.raise_for_status()
              p=Image.open(io.BytesIO(r.content)).convert('RGB')
              w,h=p.size;p=p.crop((int(.34*w),int(.37*h),int(.68*w),int(.69*h)))
              p=ImageOps.fit(p,(52,52)).convert('RGBA')
              mask=Image.new('L',(52,52),0);ImageDraw.Draw(mask).ellipse((0,0,51,51),fill=255);p.putalpha(mask)
              p=p.rotate(90).resize((35,35));im.alpha_composite(p,(465,181))
          except Exception as e: print('portrait unavailable',e)
          im.save('onurspor-dls-512.png')
          assert Image.open('onurspor-dls-512.png').size==(512,512)
          PY
          python /tmp/render.py
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add onurspor-dls-512.png
          if ! git diff --cached --quiet; then
            git commit -m 'Correct Onurspor atlas sponsor position'
            git push
          fi
