name: Publish Onurspor DLS26 template-fixed kit
on:
  push:
    paths: ['.github/workflows/update-onurspor-kit.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact 512px DLS26 kit
        run: |
          curl --fail --location --retry 3 --output onurspor-dls-512.png 'https://at.adobe.com/qQmRw9PnaZsIxAHz'
          python3 - <<'PY'
          import struct
          with open('onurspor-dls-512.png','rb') as f: raw=f.read(30)
          assert raw[:8] == b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II',raw[16:24])==(512,512)
          print('512x512 PNG confirmed')
          PY
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add onurspor-dls-512.png
          if ! git diff --cached --quiet; then
            git commit -m 'Correct Onurspor DLS26 kit using in-game template mask'
            git push
          fi
