name: Publish Onurspor exact artwork on verified DLS template
on:
  push:
    paths: ['.github/workflows/update-onurspor-kit.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch mapped transparent 512x512 kit
        run: |
          curl --fail --location --retry 3 --output onurspor-dls-512.png 'https://at.adobe.com/fw07CiN1v6JymDWH'
          python3 - <<'PY'
          import struct
          data=open('onurspor-dls-512.png','rb').read(30)
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II',data[16:24]) == (512,512)
          print('Verified 512x512 PNG image')
          PY
      - name: Commit revised kit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add onurspor-dls-512.png
          if ! git diff --cached --quiet; then
            git commit -m 'Apply original Onurspor design on DLS official UV layout'
            git push
          fi
