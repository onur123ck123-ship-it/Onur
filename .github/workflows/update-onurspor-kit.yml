name: Update Onurspor DLS kit
on:
  push:
    paths:
      - '.github/workflows/update-onurspor-kit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download RGBA PNG
        run: |
          curl --fail --location --retry 3 --output onurspor-dls-512.png 'https://at.adobe.com/VuG5tIl0QOkNbYIN'
          file onurspor-dls-512.png
          test "$(file --mime-type -b onurspor-dls-512.png)" = 'image/png'
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add onurspor-dls-512.png
          git commit -m 'Replace kit with standard RGBA PNG' || exit 0
          git push
