<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#090b0a" />
<title>NVIDIA AI Hub</title>
<style>
:root{--bg:#090b0a;--panel:#101410;--panel2:#171d17;--line:#273027;--text:#f4f7f4;--muted:#9ca79d;--green:#76b900;--green2:#9bd72b;--bad:#ff8d8d}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}button,input,textarea,select{font:inherit}.app{height:100%;display:flex;flex-direction:column}.top{height:64px;display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:#0c100c;position:relative;z-index:5}.brand{display:flex;align-items:center;gap:10px;font-weight:800;white-space:nowrap}.mark{width:29px;height:29px;border:2px solid var(--green);border-radius:8px;transform:rotate(45deg);position:relative}.mark:after{content:"";position:absolute;inset:8px;background:var(--green);border-radius:3px}.model{flex:1;min-width:0;max-width:560px;background:var(--panel);border:1px solid var(--line);color:#fff;border-radius:11px;padding:9px 10px}.btn{border:1px solid var(--line);background:var(--panel2);color:#fff;border-radius:11px;padding:9px 12px;cursor:pointer}.btn.green{background:var(--green);border-color:var(--green);color:#071000;font-weight:800}.btn.bad{color:#ffb1b1}.main{flex:1;min-height:0;position:relative}.msgs{height:100%;overflow:auto;padding:24px 14px 160px}.empty{height:100%;display:grid;place-items:center;text-align:center;padding:28px}.empty h1{font-size:clamp(31px,7vw,60px);margin:0 0 12px}.empty p{color:var(--muted);font-size:17px;max-width:640px;line-height:1.5}.msg{max-width:900px;margin:0 auto 22px}.msg.user{display:flex;justify-content:flex-end}.bubble{max-width:90%;line-height:1.55;white-space:pre-wrap;word-break:break-word}.user .bubble{background:#1b221b;padding:12px 14px;border-radius:16px}.assistant .bubble{padding:4px 0}.meta{font-size:12px;color:var(--muted);margin-bottom:6px}.reason{font-size:13px;color:var(--muted);margin-top:6px}.composerWrap{position:absolute;left:0;right:0;bottom:0;padding:18px 14px 14px;background:linear-gradient(transparent,var(--bg) 30%)}.composer{max-width:920px;margin:auto;background:#111611;border:1px solid var(--line);border-radius:20px;padding:10px;box-shadow:0 12px 40px #0008}.attach{display:none;align-items:center;gap:8px;padding:5px 7px 10px;font-size:13px;color:#d3dad3}.attach img{width:46px;height:46px;object-fit:cover;border-radius:9px}.composer textarea{width:100%;min-height:48px;max-height:180px;resize:none;background:transparent;border:0;outline:0;color:#fff;padding:10px}.row{display:flex;align-items:center;gap:8px}.send{margin-left:auto;border:0;background:var(--green);color:#071000;font-weight:800;border-radius:10px;padding:10px 16px}.sub{font-size:12px;color:var(--muted)}.ok{color:#afe85f}.modalBack{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modalBack.show{display:flex}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#111611;border:1px solid var(--line);border-radius:20px;padding:20px}.modal h2{margin-top:0}.stack{display:grid;gap:12px}.field{width:100%;background:#0d110d;border:1px solid var(--line);color:#fff;border-radius:11px;padding:11px}.label{display:grid;gap:6px;color:#dce2dc;font-size:13px}.status{font-size:13px;color:var(--muted)}.status.ok{color:#aee95c}.status.bad{color:#ff9e9e}.catalog{display:none;position:fixed;inset:64px 0 0;background:var(--bg);z-index:10;overflow:auto;padding:16px}.catalog.show{display:block}.toolbar{display:flex;gap:8px;max-width:1100px;margin:0 auto 14px}.toolbar input{flex:1}.grid{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:12px;padding-bottom:40px}.card{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:15px}.card h3{font-size:14px;word-break:break-word;margin:0 0 10px}.badge{display:inline-block;font-size:11px;background:#1b231b;color:#d6ded6;border-radius:20px;padding:5px 8px;margin:0 5px 12px 0}.hidden{display:none!important}@media(max-width:700px){.brand span{display:none}.top{padding:8px}.model{max-width:none}.msgs{padding:18px 11px 150px}.composerWrap{padding:10px}.bubble{max-width:96%}.top .btn{padding:9px 10px}.catalog{padding:12px}.toolbar{flex-direction:column}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><div class="mark"></div><span>NVIDIA AI Hub</span></div>
    <select id="model" class="model"></select>
    <button id="modelsBtn" class="btn">Modeller</button>
    <button id="settingsBtn" class="btn">⚙︎</button>
  </div>
  <div class="main">
    <div id="msgs" class="msgs"></div>
    <div class="composerWrap">
      <div class="composer">
        <div id="attach" class="attach"></div>
        <textarea id="input" placeholder="Mesajını yaz…"></textarea>
        <div class="row">
          <input id="file" type="file" accept="image/*" hidden>
          <button id="fileBtn" class="btn">＋ Resim</button>
          <button id="urlBtn" class="btn">🔗 URL</button>
          <span id="conn" class="sub">API bağlı değil</span>
          <button id="send" class="send">Gönder</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="catalog" class="catalog">
  <div class="toolbar"><input id="search" class="field" placeholder="Model ara…"><button id="closeCatalog" class="btn">Kapat</button></div>
  <div id="grid" class="grid"></div>
</div>

<div id="connect" class="modalBack"><div class="modal"><h2>NVIDIA API bağla</h2><p class="status">API anahtarı yalnızca bu tarayıcı oturumunda tutulur. localStorage'a kaydedilmez.</p><div class="stack"><label class="label">NVIDIA API key<input id="keyInput" class="field" type="password" autocomplete="off" placeholder="nvapi-…"></label><div class="row"><button id="testKey" class="btn">Test et</button><button id="saveKey" class="btn green">Bağla</button></div><div id="connectMsg" class="status"></div></div></div></div>

<div id="settings" class="modalBack"><div class="modal"><h2>Ayarlar</h2><div class="stack"><label class="label">Temperature<input id="temperature" type="range" min="0" max="2" step="0.1"></label><label class="label">Top P<input id="topP" type="range" min="0.1" max="1" step="0.05"></label><label class="label">Max tokens<input id="maxTokens" class="field" type="number" min="64" max="8192"></label><label class="label">System prompt<textarea id="systemPrompt" class="field" rows="4"></textarea></label><label class="label"><span><input id="stream" type="checkbox"> Streaming kullan</span></label><div class="row"><button id="testSettings" class="btn">Bağlantıyı test et</button><button id="changeKey" class="btn">API key değiştir</button><button id="clearKey" class="btn bad">Key'i sil</button></div><div id="settingsMsg" class="status"></div><div class="row"><button id="saveSettings" class="btn green">Kaydet</button><button id="closeSettings" class="btn">Kapat</button></div></div></div></div>

<script>
(function(){
const API='https://bztigwfnenwosulhxrxo.supabase.co/functions/v1/nvidia-hub';
const F=['openai/gpt-oss-20b','google/gemma-4-31b-it','nvidia/nemotron-3.5-lightning-30b-a3b','nvidia/nemotron-3-super-120b-a12b','moonshotai/kimi-k3','moonshotai/kimi-k2.6','z-ai/glm-5-3','z-ai/glm-5-3-flash'];
const S={models:F.slice(),messages:[],busy:false,controller:null,attachment:null,settings:{temperature:.7,top_p:.95,max_tokens:1024,system_prompt:'',stream:true}};
const $=id=>document.getElementById(id);
function key(){return sessionStorage.getItem('nv_key')||''}
function setKey(v){if(v)sessionStorage.setItem('nv_key',v);else sessionStorage.removeItem('nv_key');updateConn()}
function updateConn(){$('conn').textContent=key()?'API bağlı':'API bağlı değil';$('conn').className=key()?'sub ok':'sub'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){localStorage.setItem('nvhub_msgs',JSON.stringify(S.messages));localStorage.setItem('nvhub_settings',JSON.stringify(S.settings))}
function load(){try{const m=JSON.parse(localStorage.getItem('nvhub_msgs')||'[]');if(Array.isArray(m))S.messages=m;const s=JSON.parse(localStorage.getItem('nvhub_settings')||'null');if(s)S.settings=Object.assign(S.settings,s)}catch(e){}}
function renderModels(){const sel=$('model'),cur=sel.value;sel.innerHTML='';S.models.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;if(m===cur)o.selected=true;sel.appendChild(o)});renderGrid()}
function renderGrid(){const q=$('search').value.toLowerCase();$('grid').innerHTML='';S.models.filter(m=>!q||m.toLowerCase().includes(q)).forEach(m=>{const c=document.createElement('div');c.className='card';const p=m.split('/')[0];c.innerHTML='<h3>'+esc(m)+'</h3><span class="badge">'+esc(p)+'</span><span class="badge">text</span><br><button class="btn green">Sohbet et</button>';c.querySelector('button').onclick=()=>{$('model').value=m;$('catalog').classList.remove('show')};$('grid').appendChild(c)})}
function render(){const box=$('msgs');if(!S.messages.length){box.innerHTML='<div class="empty"><div><h1>NVIDIA AI modelleri tek yerde.</h1><p>Bir model seç, NVIDIA API anahtarını bağla ve sohbet etmeye başla.</p><button id="emptyConnect" class="btn green">API bağla</button></div></div>';setTimeout(()=>{if($('emptyConnect'))$('emptyConnect').onclick=openConnect},0);return}box.innerHTML='';S.messages.forEach(m=>{const d=document.createElement('div');d.className='msg '+m.role;d.innerHTML='<div class="bubble">'+(m.role==='assistant'?'<div class="meta">'+esc(m.model||$('model').value)+'</div>':'')+esc(m.content)+(m.reasoning?'<div class="reason">Reasoning…</div>':'')+'</div>';box.appendChild(d)});box.scrollTop=box.scrollHeight}
function openConnect(){$('connect').classList.add('show');$('keyInput').value='';$('connectMsg').textContent=''}
function closeConnect(){$('connect').classList.remove('show')}
async function api(action,body,raw){const h={'content-type':'application/json'};if(key())h['x-nvidia-key']=key();const r=await fetch(API+'?action='+encodeURIComponent(action),{method:'POST',headers:h,body:JSON.stringify(body||{}),signal:S.controller?S.controller.signal:undefined});if(!r.ok){let j={};try{j=await r.json()}catch(e){}throw new Error(j.error||('HTTP '+r.status))}return raw?r:r.json()}
async function testConnection(){const j=await api('test',{});return !!(j&&j.ok)}
async function loadModels(){if(!key()){S.models=F.slice();renderModels();return}try{const j=await api('models',{});const a=(j.data||[]).map(x=>x&&x.id).filter(Boolean);S.models=a.length?a:F.slice()}catch(e){S.models=F.slice()}renderModels()}
async function send(){if(S.busy){if(S.controller)S.controller.abort();return}const text=$('input').value.trim();if(!text&&!S.attachment)return;if(!key()){openConnect();return}let content=text;if(S.attachment)content=[{type:'text',text:text||'Bu görseli analiz et.'},{type:'image_url',image_url:{url:S.attachment.url}}];S.messages.push({role:'user',content});$('input').value='';clearAttachment();const am={role:'assistant',content:'',model:$('model').value,reasoning:false};S.messages.push(am);save();render();S.busy=true;S.controller=new AbortController();$('send').textContent='Durdur';try{const msgs=S.messages.slice(0,-1).map(m=>({role:m.role,content:m.content}));if(S.settings.system_prompt)msgs.unshift({role:'system',content:S.settings.system_prompt});const payload={model:$('model').value,messages:msgs,temperature:Number(S.settings.temperature),top_p:Number(S.settings.top_p),max_tokens:Number(S.settings.max_tokens),stream:!!S.settings.stream};if(S.settings.stream){const r=await api('chat',payload,true);const rd=r.body.getReader(),dec=new TextDecoder();let buf='';while(true){const x=await rd.read();if(x.done)break;buf+=dec.decode(x.value,{stream:true});const lines=buf.split('\n');buf=lines.pop()||'';for(const line0 of lines){const line=line0.trim();if(!line.startsWith('data:'))continue;const t=line.slice(5).trim();if(!t||t==='[DONE]')continue;try{const o=JSON.parse(t),d=o.choices&&o.choices[0]&&o.choices[0].delta||{};if(d.reasoning_content)am.reasoning=true;if(d.content){am.reasoning=false;am.content+=d.content;render()}}catch(e){}}}}else{const j=await api('chat',payload,false);am.content=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||''}save();render()}catch(e){if(e.name!=='AbortError'){am.content='⚠️ '+e.message;save();render()}}finally{S.busy=false;S.controller=null;$('send').textContent='Gönder'}}
function setAttachment(url,label){S.attachment={url,label};const a=$('attach');a.style.display='flex';a.innerHTML='<img src="'+esc(url)+'"><span>'+esc(label)+'</span><button id="removeAtt" class="btn">Kaldır</button>';setTimeout(()=>{$('removeAtt').onclick=clearAttachment},0)}
function clearAttachment(){S.attachment=null;$('attach').style.display='none';$('attach').innerHTML=''}
$('send').onclick=send;$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('modelsBtn').onclick=()=>{$('catalog').classList.add('show')};$('closeCatalog').onclick=()=>{$('catalog').classList.remove('show')};$('search').oninput=renderGrid;$('settingsBtn').onclick=()=>{const s=S.settings;$('temperature').value=s.temperature;$('topP').value=s.top_p;$('maxTokens').value=s.max_tokens;$('systemPrompt').value=s.system_prompt;$('stream').checked=s.stream;$('settingsMsg').textContent=key()?'API key oturumda bağlı':'API key bağlı değil';$('settings').classList.add('show')};$('closeSettings').onclick=()=>{$('settings').classList.remove('show')};$('saveSettings').onclick=()=>{S.settings.temperature=$('temperature').value;S.settings.top_p=$('topP').value;S.settings.max_tokens=$('maxTokens').value;S.settings.system_prompt=$('systemPrompt').value;S.settings.stream=$('stream').checked;save();$('settings').classList.remove('show')};$('changeKey').onclick=()=>{$('settings').classList.remove('show');openConnect()};$('clearKey').onclick=()=>{setKey('');$('settings').classList.remove('show')};$('testSettings').onclick=async()=>{const el=$('settingsMsg');el.textContent='Test ediliyor…';try{await testConnection();el.textContent='Bağlantı başarılı';el.className='status ok'}catch(e){el.textContent=e.message;el.className='status bad'}};$('saveKey').onclick=async()=>{const v=$('keyInput').value.trim();if(!v)return;setKey(v);closeConnect();await loadModels()};$('testKey').onclick=async()=>{const v=$('keyInput').value.trim();if(!v)return;setKey(v);const el=$('connectMsg');el.textContent='Test ediliyor…';try{await testConnection();el.textContent='Bağlantı başarılı';el.className='status ok'}catch(e){el.textContent=e.message;el.className='status bad'}};$('fileBtn').onclick=()=>{$('file').click()};$('file').onchange=function(){const f=this.files&&this.files[0];if(!f)return;if(f.size>1600000){alert('Görsel 1.6 MB’dan küçük olmalı');return}const r=new FileReader();r.onload=()=>setAttachment(String(r.result),f.name);r.readAsDataURL(f)};$('urlBtn').onclick=()=>{const u=prompt('Görsel URL’si:');if(u&&/^https:\/\//i.test(u))setAttachment(u,'URL görseli');else if(u)alert('HTTPS URL kullan')};$('connect').onclick=e=>{if(e.target===$('connect')&&key())closeConnect()};$('settings').onclick=e=>{if(e.target===$('settings'))$('settings').classList.remove('show')};
load();updateConn();renderModels();render();if(key())loadModels();else openConnect();
})();
</script>
</body>
</html>
